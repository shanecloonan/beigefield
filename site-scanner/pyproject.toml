[project]
name = "site-scanner"
version = "0.1.0"
description = "Passive website misconfiguration scanner. Heat comes from evidence. Active checks stay on an allowlist."
requires-python = ">=3.10"

[project.scripts]
site-scanner = "site_scanner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
