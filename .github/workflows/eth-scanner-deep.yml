# Deep job: curated master-list Lane A (default) plus the defensive Foundry
# mock suite. Foundry is installed with foundry-rs/foundry-toolchain so forge
# is on PATH. Pass discover=true to claim the old discovery queue instead.
# Defensive only. Never sends transactions.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
# Recommended:
#   ETHERSCAN_API_KEYS
#   ETH_RPC_URL
#
# See docs/scanner-roadmap.md § Secrets checklist (Phase A).

name: eth-scanner-deep

on:
  schedule:
    # Every hour — stay well under free GHA minutes.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      claim:
        description: "Discovery mode only: max targets to claim"
        required: false
        default: "2"
      engines:
        description: "Discovery mode only. Comma list: slither,aderyn,mythril,halmos"
        required: false
        default: "slither,aderyn,mythril"
      discover:
        description: "true = claim the discovery queue instead of the master list"
        required: false
        default: "false"
      deadline_minutes:
        description: "Stop starting new strong-candidate batches after N minutes"
        required: false
        default: "35"
      workers:
        description: "Parallel strong candidates (each runs engines with their own timeouts)"
        required: false
        default: "2"

concurrency:
  group: eth-scanner-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep:
    name: Master list + Foundry suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache solc + pip tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.solc-select
            ~/.cache/pip
            ~/.semgrep
          key: deep-tools-${{ runner.os }}-py312-v3

      - name: Install solc + scanner + engines (best-effort)
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel
          python -m pip install solc-select
          solc-select install 0.8.20 || true
          solc-select use 0.8.20 || true
          python -m pip install -e ./eth-scanner
          python -m pip install "slither-analyzer==0.11.6" "mythril==0.24.8" "halmos==0.3.3" "semgrep==1.185.0"
          solc-select install 0.6.12 0.7.6 0.8.17 0.8.20 0.8.26 || true
          solc-select use 0.8.20 || true
          # Aderyn upstream withdrew official binaries (installer exits 1). Try the
          # last published tarball; the scanner skips the engine when it is absent.
          if ! command -v aderyn >/dev/null 2>&1; then
            curl -fsSL -o /tmp/aderyn.tgz \
              "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.4.0/aderyn-x86_64-unknown-linux-gnu.tar.gz" \
              && tar -xzf /tmp/aderyn.tgz -C /tmp \
              && sudo mv /tmp/aderyn /usr/local/bin/aderyn \
              && sudo chmod +x /usr/local/bin/aderyn \
              || echo "aderyn unavailable (upstream binaries withdrawn) — engine will skip"
          fi
          mkdir -p "$HOME/.local/bin"
          if ! command -v medusa >/dev/null 2>&1; then
            curl -fsSL -o /tmp/medusa.tgz \
              "https://github.com/crytic/medusa/releases/download/v1.5.1/medusa-linux-x64.tar.gz" \
              && tar -xzf /tmp/medusa.tgz -C /tmp \
              && find /tmp -maxdepth 3 -type f -name medusa -exec cp {} "$HOME/.local/bin/medusa" \; \
              && chmod +x "$HOME/.local/bin/medusa" \
              || echo "medusa install skipped"
          fi
          if ! command -v echidna >/dev/null 2>&1; then
            curl -fsSL -o /tmp/echidna.tgz \
              "https://github.com/crytic/echidna/releases/download/v2.4.0/echidna-2.4.0-x86_64-linux.tar.gz" \
              && tar -xzf /tmp/echidna.tgz -C /tmp \
              && find /tmp -maxdepth 3 -type f -name echidna -exec cp {} "$HOME/.local/bin/echidna" \; \
              && chmod +x "$HOME/.local/bin/echidna" \
              || echo "echidna install skipped"
          fi
          # Ityfuzz pin: nightly-35b7f08962fdd0c2e02df7ef8a43164913d514d9
          # (same tag as eth_scanner.deep.blend.versions).
          if ! command -v ityfuzz >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ityfuzz.tgz \
              "https://github.com/fuzzland/ityfuzz/releases/download/nightly-35b7f08962fdd0c2e02df7ef8a43164913d514d9/ityfuzz_nightly_linux_amd64.tar.gz" \
              && tar -xzf /tmp/ityfuzz.tgz -C /tmp \
              && find /tmp -maxdepth 3 -type f -name ityfuzz -exec cp {} "$HOME/.local/bin/ityfuzz" \; \
              && chmod +x "$HOME/.local/bin/ityfuzz" \
              || echo "ityfuzz install skipped"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 https://github.com/Decurity/semgrep-smart-contracts.git /tmp/semgrep-smart-contracts || true
          if [ -d /tmp/semgrep-smart-contracts ]; then
            echo "ETH_SCANNER_SEMGREP_RULES=/tmp/semgrep-smart-contracts" >> "$GITHUB_ENV"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          echo "forge $(forge --version 2>/dev/null | head -1)"
          echo "slither $(slither --version 2>/dev/null | head -1)"
          echo "mythril $(myth version 2>/dev/null | head -1)"
          echo "halmos $(halmos --version 2>/dev/null | head -1)"
          echo "semgrep $(semgrep --version 2>/dev/null | head -1)"
          echo "aderyn $(aderyn --version 2>/dev/null | head -1)"
          echo "medusa $(medusa --version 2>/dev/null | head -1)"
          echo "echidna $(echidna --version 2>/dev/null | head -1)"
          echo "ityfuzz $(ityfuzz --version 2>/dev/null | head -1)"
          set -e
          python - <<'PY'
          from eth_scanner.deep.runners import engine_availability
          print("engine_availability=", engine_availability())
          PY

      - name: Blend fixture proofs
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python - <<'PY'
          from eth_scanner.deep.blend.orchestrator import run_blend
          leaky = run_blend(fixture="leaky")
          safe = run_blend(fixture="safe")
          bundle = run_blend(fixture="leaky-strategy")
          evidence = run_blend(fixture="evidence-only")
          assert leaky["bucket"] == "drain-found" and leaky["heat"] > 0, leaky["heat"]
          assert safe["heat"] == 0 and safe["bucket"] == "no"
          assert bundle["bucket"] == "drain-found" and bundle["heat"] > 0
          assert evidence["heat"] == 0 and evidence["findings"][0]["kind"] == "evidence-only"
          print("blend fixtures ok", leaky["heat"], safe["heat"], bundle["heat"], evidence["heat"])
          from eth_scanner.deep.blend.adapt.versions import ADAPTATION_PINS
          for name, pin in ADAPTATION_PINS.items():
              assert pin["version"], name
              print("adapt", name, pin["version"])
          assert evidence["adaptations"]["daikon"]["heat_contribution"] == 0
          assert evidence["adaptations"]["daikon"]["violations"]
          assert bundle["adaptations"]["lithium"]["minimized_calls"] == ["Strategy.skim"]
          assert bundle["adaptations"]["lithium"]["heat_contribution"] == 0
          PY

      - name: Phase B defensive Foundry mock suite
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v forge
          forge --version | head -1
          python -m eth_scanner fork-props \
            --address 0x1111111111111111111111111111111111111111 \
            --class vault \
            --forge \
            --timeout 240 \
            --json

      - name: Deep-scan strong candidates (or discovery queue)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ETH_SCANNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_SCANNER_DRY_RUN: "0"
          INPUT_DISCOVER: ${{ github.event.inputs.discover || 'false' }}
          INPUT_CLAIM: ${{ github.event.inputs.claim || '2' }}
          INPUT_ENGINES: ${{ github.event.inputs.engines || 'slither,aderyn,mythril' }}
          INPUT_DEADLINE: ${{ github.event.inputs.deadline_minutes || '35' }}
          INPUT_WORKERS: ${{ github.event.inputs.workers || '2' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SECRET_KEY — add them as Actions secrets."
            echo "See docs/scanner-roadmap.md"
            exit 0
          fi
          case "${INPUT_DISCOVER}" in
            true|TRUE|yes|YES|1)
              echo "discovery mode: claim lane-b / manual-review queue"
              python -m eth_scanner deep \
                --discover \
                --claim "$INPUT_CLAIM" \
                --engines "$INPUT_ENGINES" \
                --timeout 90 \
                --json
              ;;
            *)
              echo "strong-deep: hot/Lane B, tier1>=\$10k, tier2>=\$100k; no per-run cap"
              python -m eth_scanner strong-deep \
                --workers "$INPUT_WORKERS" \
                --deadline-minutes "$INPUT_DEADLINE" \
                --json
              ;;
          esac
