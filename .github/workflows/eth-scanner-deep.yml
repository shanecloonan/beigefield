# Deep job: curated master-list Lane A (default) plus the defensive Foundry
# mock suite. Foundry is installed with foundry-rs/foundry-toolchain so forge
# is on PATH. Pass discover=true to claim the old discovery queue instead.
# Defensive only. Never sends transactions.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
# Recommended:
#   ETHERSCAN_API_KEYS
#   ETH_RPC_URL
#
# See docs/scanner-roadmap.md § Secrets checklist (Phase A).

name: eth-scanner-deep

on:
  schedule:
    # Every hour — stay well under free GHA minutes.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      claim:
        description: "Discovery mode only: max targets to claim"
        required: false
        default: "2"
      engines:
        description: "Discovery mode only. Comma list: slither,aderyn,mythril,halmos"
        required: false
        default: "slither,aderyn,mythril"
      discover:
        description: "true = claim the discovery queue instead of the master list"
        required: false
        default: "false"
      deadline_minutes:
        description: "Master-list mode: stop starting new batches after N minutes"
        required: false
        default: "15"
      workers:
        description: "Master-list mode: parallel Lane A workers"
        required: false
        default: "4"

concurrency:
  group: eth-scanner-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep:
    name: Master list + Foundry suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache solc + pip tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.solc-select
            ~/.cache/pip
          key: deep-tools-${{ runner.os }}-py312-v1

      - name: Install solc + scanner + engines (best-effort)
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel
          python -m pip install solc-select
          solc-select install 0.8.20 || true
          solc-select use 0.8.20 || true
          python -m pip install -e ./eth-scanner
          # Owner forks preferred; fall back to PyPI if git clone is slow.
          python -m pip install "slither-analyzer" || \
            python -m pip install "git+https://github.com/shanecloonan/slither" || true
          python -m pip install mythril || true
          # Aderyn: try prebuilt release (fast); cargo install is too heavy for free tier.
          if ! command -v aderyn >/dev/null 2>&1; then
            curl -fsSL -o /tmp/aderyn.tgz \
              "https://github.com/Cyfrin/aderyn/releases/latest/download/aderyn-x86_64-unknown-linux-gnu.tar.gz" \
              && tar -xzf /tmp/aderyn.tgz -C /tmp \
              && sudo mv /tmp/aderyn /usr/local/bin/aderyn \
              && sudo chmod +x /usr/local/bin/aderyn \
              || echo "aderyn install skipped"
          fi
          command -v forge
          forge --version | head -1
          python - <<'PY'
          from eth_scanner.deep.runners import engine_availability
          print("engine_availability=", engine_availability())
          PY

      - name: Phase B defensive Foundry mock suite
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v forge
          forge --version | head -1
          python -m eth_scanner fork-props \
            --address 0x1111111111111111111111111111111111111111 \
            --class vault \
            --forge \
            --timeout 240 \
            --json

      - name: Scan master list (or discovery queue)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ETH_SCANNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETH_SCANNER_DRY_RUN: "0"
          INPUT_DISCOVER: ${{ github.event.inputs.discover || 'false' }}
          INPUT_CLAIM: ${{ github.event.inputs.claim || '2' }}
          INPUT_ENGINES: ${{ github.event.inputs.engines || 'slither,aderyn,mythril' }}
          INPUT_DEADLINE: ${{ github.event.inputs.deadline_minutes || '15' }}
          INPUT_WORKERS: ${{ github.event.inputs.workers || '4' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SECRET_KEY — add them as Actions secrets."
            echo "See docs/scanner-roadmap.md"
            exit 0
          fi
          case "${INPUT_DISCOVER}" in
            true|TRUE|yes|YES|1)
              echo "discovery mode: claim lane-b / manual-review queue"
              python -m eth_scanner deep \
                --discover \
                --claim "$INPUT_CLAIM" \
                --engines "$INPUT_ENGINES" \
                --timeout 90 \
                --json
              ;;
            *)
              echo "master-list mode: rank order, no per-run cap, shared resume cursor"
              python -m eth_scanner master-list \
                --workers "$INPUT_WORKERS" \
                --deadline-minutes "$INPUT_DEADLINE" \
                --json
              ;;
          esac
