# Offline checks for the site scanner. No hosts are contacted.
name: site-scanner-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner
        run: python -m pip install -e ./site-scanner
      - name: Unit tests
        run: PYTHONPATH=site-scanner/src:eth-scanner/src python -m unittest discover -s site-scanner/tests -q
