# Read-only Lane A with fork verify on. Pushing eth-scanner/signal-rerun.trigger
# to main scans the next under-$5k high-likelihood batch from queue 1
# (75 contracts, 250k CU). Pushing eth-scanner/signal-rerun-q2.trigger scans
# queue 2 the same way. Pushing eth-scanner/full-path.trigger scans the
# addresses in that file, in order (fork verify, fuzz, Halmos, 60k CU) and
# does not start either under-$5k queue. Pushing eth-scanner/high-prob.trigger
# scans the next 300 unscanned contracts at or above $5,000 (normal scan,
# then fork and fuzz only where heat is above 0, 400k CU) and does not start
# either under-$5k queue. Pushing eth-scanner/held-funds.trigger measures
# ETH and major-token balances and scans the richest 500 unscanned contracts
# (normal scan, then fork and fuzz only where heat is above 0, 400k CU).
# The job timeout covers that batch.
# Queue runs still stop on their own 55 minute deadline. workflow_dispatch
# can still select either queue.
# workflow_dispatch mode "historical" re-scores stored signals inside 4M CU.
# The monitor and the backfill leave fork verify off. This job holds the
# shared scan-cycle lease so those crons do not scan at the same time.
name: eth-scanner-signal-rerun

on:
  push:
    branches: [main]
    paths:
      - eth-scanner/signal-rerun.trigger
      - eth-scanner/signal-rerun-q2.trigger
      - eth-scanner/full-path.trigger
      - eth-scanner/high-prob.trigger
      - eth-scanner/held-funds.trigger
  workflow_dispatch:
    inputs:
      mode:
        description: "small-value-batch continues the under-$5k queue. historical re-scores stored signals."
        type: choice
        options:
          - small-value-batch
          - historical
        default: small-value-batch
      queue:
        description: "Which under-$5k queue a small-value batch reads. 1 is the current file. 2 is the follow-up. Ignored for historical. A push of signal-rerun.trigger stays on queue 1. A push of signal-rerun-q2.trigger selects queue 2."
        type: choice
        options:
          - "1"
          - "2"
        default: "1"

permissions:
  contents: read

concurrency:
  group: eth-scanner-signal-rerun
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-tree needs the parent. A depth-1 checkout lists no files.
          fetch-depth: 2
      - name: Install Foundry
        id: foundry
        uses: foundry-rs/foundry-toolchain@v1
        continue-on-error: true
        with:
          version: stable
      # GitHub's release host sometimes 504s on the attestation download.
      # One retry is enough for that blip; a second failure still stops the job.
      - name: Wait before retrying Foundry
        if: steps.foundry.outcome == 'failure'
        run: sleep 20
      - name: Install Foundry retry
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanner + engines
        run: |
          set -euo pipefail
          python -m pip install -e ./eth-scanner
          python -m pip install solc-select
          solc-select install 0.8.20 || true
          solc-select use 0.8.20 || true
          python -m pip install "slither-analyzer>=0.10.0" || true
          python -m venv /tmp/mythril-venv
          /tmp/mythril-venv/bin/pip install -q --upgrade pip
          /tmp/mythril-venv/bin/pip install -q "mythril>=0.24.0" || true
          if [ -x /tmp/mythril-venv/bin/myth ]; then
            echo "ETH_SCANNER_MYTHRIL_BIN=/tmp/mythril-venv/bin/myth" >> "$GITHUB_ENV"
          elif [ -x /tmp/mythril-venv/bin/mythril ]; then
            echo "ETH_SCANNER_MYTHRIL_BIN=/tmp/mythril-venv/bin/mythril" >> "$GITHUB_ENV"
          fi
          command -v forge && forge --version | head -1 || echo "forge missing"
          command -v anvil && anvil --version | head -1 || echo "anvil missing"
          bash eth-scanner/scripts/install-blend-engines.sh || echo "blend engine install failed open"

      - name: Scan the next under-$5k batch, or historical signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ETH_SCANNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          ETH_SCANNER_FORK_VERIFY: "1"
          ETH_SCANNER_FORK_VERIFY_REDACT: "1"
          ETH_SCANNER_FUZZ_MIN_HEAT: "0"
          ETH_SCANNER_FUZZ_TIMEOUT_S: "45"
          ETH_SCANNER_FUZZ_RUNS: "8"
          RERUN_MODE: ${{ github.event.inputs.mode || 'small-value-batch' }}
          DISPATCH_QUEUE: ${{ github.event.inputs.queue || '1' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing Actions secrets SUPABASE_URL / SUPABASE_SECRET_KEY — skip."
            exit 0
          fi
          if [ -z "${ETH_RPC_URL:-}" ]; then
            echo "ETH_RPC_URL unset — signal rerun skipped."
            exit 0
          fi
          cd eth-scanner
          # The push payload on the runner can omit commit file lists, so a push
          # reads git diff-tree of the checked-out commit. Queue 1's trigger file
          # still wins when both queue files change. A full-path trigger scans
          # the address list in that file and does not start a queue. A high-prob
          # trigger scans the next unscanned contracts at or above $5,000 and
          # does not start a queue either.
          # workflow_dispatch uses its input.
          MODE="queue"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CHANGED=""
            RERUN_QUEUE="$(python - <<'PY'
          import os
          from eth_scanner.desk.signal_rerun import queue_id_for_github_event
          event = {"inputs": {"queue": os.environ.get("DISPATCH_QUEUE") or ""}}
          print(queue_id_for_github_event(event, "workflow_dispatch"))
          PY
          )"
          else
            CHANGED="$(git diff-tree -m --no-commit-id --name-only -r HEAD)"
            if [ -z "${CHANGED}" ]; then
              echo "signal-rerun could not read the files changed in HEAD; not guessing a queue."
              exit 1
            fi
            MODE="$(CHANGED_FILES="$CHANGED" python - <<'PY'
          import os
          from eth_scanner.desk.signal_rerun import run_mode_for_changed_files
          print(run_mode_for_changed_files(os.environ.get("CHANGED_FILES", "").splitlines()))
          PY
          )"
            if [ "${MODE}" != "full-path" ] && [ "${MODE}" != "high-prob" ] && [ "${MODE}" != "held-funds" ]; then
              RERUN_QUEUE="$(CHANGED_FILES="$CHANGED" python - <<'PY'
          import os
          from eth_scanner.desk.signal_rerun import queue_id_for_changed_files
          print(queue_id_for_changed_files(os.environ.get("CHANGED_FILES", "").splitlines()))
          PY
          )"
            else
              RERUN_QUEUE=""
            fi
          fi
          if [ "${MODE}" = "full-path" ]; then
            mapfile -t ADDRS < <(python - <<'PY'
          from eth_scanner.desk.signal_rerun import addresses_from_full_path_trigger
          for addr in addresses_from_full_path_trigger():
              print(addr)
          PY
          )
            if [ "${#ADDRS[@]}" -eq 0 ]; then
              echo "full-path trigger has no address; not starting a queue."
              exit 1
            fi
            echo "signal-rerun full-path ${#ADDRS[@]} contracts, fork verify on, fuzz min heat 0, budget 60000 CU"
            ARGS=()
            for ADDR in "${ADDRS[@]}"; do
              ARGS+=(--address "${ADDR}")
            done
            python -m eth_scanner signal-rerun "${ARGS[@]}" --budget-cu 60000 --deadline-minutes 320 --lease-wait-minutes 20 --json
          elif [ "${MODE}" = "high-prob" ]; then
            echo "signal-rerun high-prob next 300, normal scan then fork on heat above 0, budget 400000 CU"
            python -m eth_scanner high-prob-batch --limit 300 --budget-cu 400000 --deadline-minutes 300 --lease-wait-minutes 20 --json
          elif [ "${MODE}" = "held-funds" ]; then
            echo "signal-rerun held-funds next 500 by measured balances, normal scan then fork on heat above 0, budget 400000 CU"
            python -m eth_scanner held-funds-batch --limit 500 --budget-cu 400000 --deadline-minutes 300 --lease-wait-minutes 20 --json
          elif [ "${RERUN_MODE}" = "historical" ]; then
            echo "signal-rerun historical, fork verify on, fuzz min heat 0, budget 4000000 CU"
            timeout 60m python -m eth_scanner signal-rerun --budget-cu 4000000 --deadline-minutes 55 --lease-wait-minutes 20 --json
          elif [ "${RERUN_QUEUE}" = "2" ]; then
            echo "signal-rerun small-value under 5000 queue 2, fork verify on, batch 75, budget 250000 CU"
            timeout 60m python -m eth_scanner signal-rerun --small-value-batch --queue 2 --batch-size 75 --budget-cu 250000 --deadline-minutes 55 --lease-wait-minutes 20 --json
          else
            echo "signal-rerun small-value under 5000, fork verify on, batch 75, budget 250000 CU"
            timeout 60m python -m eth_scanner signal-rerun --small-value-batch --batch-size 75 --budget-cu 250000 --deadline-minutes 55 --lease-wait-minutes 20 --json
          fi
