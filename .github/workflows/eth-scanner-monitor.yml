# Seed recent deployments + upgrade / funds-delta watch (free-tier).
# Default: every 10 minutes, discover up to 1000 creates since last run,
# drain pending with 8 parallel Lane A workers until empty or deadline.
name: eth-scanner-monitor

on:
  schedule:
    # Every 10 minutes — Alchemy + Etherscan keys; concurrency group prevents overlap.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Discovery / watchlist limit (creates to seed)"
        required: false
        default: "1000"
      scan:
        description: "Max Lane A scans (drain pending until empty/deadline)"
        required: false
        default: "1000"
      lookback_hours:
        description: "Dense lookback window for creates since last run"
        required: false
        default: "2"
      workers:
        description: "Parallel Lane A workers"
        required: false
        default: "8"
      deadline_minutes:
        description: "Stop claiming new batches after N minutes"
        required: false
        default: "40"

permissions:
  contents: read

concurrency:
  group: eth-scanner-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanner + engines
        run: |
          set -euo pipefail
          python -m pip install -e ./eth-scanner
          python -m pip install solc-select
          solc-select install 0.8.20 || true
          solc-select use 0.8.20 || true
          # Slither + Mythril conflict on eth-hash/web3 — install separately.
          # Slither into the job env; Mythril into an isolated venv + PATH override.
          python -m pip install "slither-analyzer>=0.10.0" || true
          python -m venv /tmp/mythril-venv
          /tmp/mythril-venv/bin/pip install -q --upgrade pip
          /tmp/mythril-venv/bin/pip install -q "mythril>=0.24.0" || true
          if [ -x /tmp/mythril-venv/bin/myth ]; then
            export ETH_SCANNER_MYTHRIL_BIN=/tmp/mythril-venv/bin/myth
            echo "ETH_SCANNER_MYTHRIL_BIN=/tmp/mythril-venv/bin/myth" >> "$GITHUB_ENV"
          elif [ -x /tmp/mythril-venv/bin/mythril ]; then
            export ETH_SCANNER_MYTHRIL_BIN=/tmp/mythril-venv/bin/mythril
            echo "ETH_SCANNER_MYTHRIL_BIN=/tmp/mythril-venv/bin/mythril" >> "$GITHUB_ENV"
          fi
          command -v slither && slither --version | head -1 || echo "slither missing"
          # Foundry (forge/anvil) — Medusa primary fuzz, Foundry fallback.
          # foundryup-init currently installs under ~/.config/.foundry/bin.
          if ! command -v forge >/dev/null 2>&1; then
            curl -L https://foundry.paradigm.xyz | bash || true
            export PATH="$HOME/.config/.foundry/bin:$HOME/.foundry/bin:$PATH"
            echo "$HOME/.config/.foundry/bin" >> "$GITHUB_PATH"
            echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
            foundryup || "$HOME/.config/.foundry/bin/foundryup" || "$HOME/.foundry/bin/foundryup" || true
          fi
          export PATH="$HOME/.config/.foundry/bin:$HOME/.foundry/bin:$PATH"
          command -v forge && forge --version | head -1 || echo "forge missing"
          command -v anvil && anvil --version | head -1 || echo "anvil missing"
          # Medusa (optional) — parallel fuzz; skip quietly on failure.
          if ! command -v medusa >/dev/null 2>&1; then
            MEDUSA_URL="$(curl -fsSL https://api.github.com/repos/crytic/medusa/releases/latest \
              | python3 -c "import sys,json,re; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if re.search(r'linux.*x64|linux.*amd64', a['name'], re.I)), ''))" \
              || true)"
            if [ -n "${MEDUSA_URL}" ]; then
              curl -fsSL -o /tmp/medusa.tgz "$MEDUSA_URL" || true
              mkdir -p "$HOME/.local/bin"
              tar -xzf /tmp/medusa.tgz -C /tmp 2>/dev/null || true
              find /tmp -maxdepth 3 -type f -name medusa -executable -exec cp {} "$HOME/.local/bin/medusa" \; 2>/dev/null || true
              chmod +x "$HOME/.local/bin/medusa" 2>/dev/null || true
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.local/bin:$PATH"
            fi
          fi
          command -v medusa && medusa --version | head -1 || echo "medusa missing (forge fallback ok)"
          python - <<'PY'
          from eth_scanner.deep.runners import engine_availability
          from eth_scanner.engines.fuzz_runner import anvil_bin, forge_bin, medusa_bin
          print("engine_availability=", engine_availability())
          print("fuzz_tools=", {"medusa": bool(medusa_bin()), "forge": bool(forge_bin()), "anvil": bool(anvil_bin())})
          PY

      - name: Discover + scan recent deployments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ETH_SCANNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '1000' }}
          INPUT_SCAN: ${{ github.event.inputs.scan || '1000' }}
          INPUT_LOOKBACK: ${{ github.event.inputs.lookback_hours || '2' }}
          INPUT_WORKERS: ${{ github.event.inputs.workers || '8' }}
          INPUT_DEADLINE: ${{ github.event.inputs.deadline_minutes || '40' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing Actions secrets SUPABASE_URL / SUPABASE_SECRET_KEY — skip."
            exit 0
          fi
          if [ -z "${ETH_RPC_URL:-}" ]; then
            echo "WARN: ETH_RPC_URL unset — falling back to public RPCs (rate-limited)."
          fi
          if [ -z "${ETHERSCAN_API_KEYS:-}" ]; then
            echo "WARN: ETHERSCAN_API_KEYS unset — verified-source filter disabled."
          else
            echo "Etherscan verified filter: ON (prefer_verified auto)"
          fi
          LIMIT="${INPUT_LIMIT}"
          SCAN="${INPUT_SCAN}"
          LOOKBACK="${INPUT_LOOKBACK}"
          WORKERS="${INPUT_WORKERS}"
          DEADLINE="${INPUT_DEADLINE}"
          echo "monitor params limit=${LIMIT} scan=${SCAN} lookback_hours=${LOOKBACK} workers=${WORKERS} deadline_minutes=${DEADLINE}"
          # Prefer verified when ETHERSCAN_API_KEYS is set (default in discover).
          # Logs creates_found / verified_kept / unverified_skipped / scanned / duration_s on stderr.
          python -m eth_scanner monitor \
            --limit "${LIMIT}" \
            --lookback-hours "${LOOKBACK}" \
            --max-blocks 800 \
            --scan "${SCAN}" \
            --workers "${WORKERS}" \
            --deadline-minutes "${DEADLINE}" \
            --json \
            --persist
