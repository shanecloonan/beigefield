# Seed recent deployments + upgrade / funds-delta watch (free-tier).
# Default: every 20 minutes, discover up to 100 creates, scan 40 with Lane A.
name: eth-scanner-monitor

on:
  schedule:
    # Every 20 minutes — Alchemy + Etherscan keys support this cadence.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Discovery / watchlist limit (creates to seed)"
        required: false
        default: "100"
      scan:
        description: "Lane A scans after seeding (claim pending)"
        required: false
        default: "40"
      lookback_hours:
        description: "Lookback window for recent contract creates"
        required: false
        default: "48"

permissions:
  contents: read

concurrency:
  group: eth-scanner-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanner
        run: python -m pip install -e ./eth-scanner
      - name: Discover + scan recent deployments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ETH_SCANNER_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '100' }}
          INPUT_SCAN: ${{ github.event.inputs.scan || '40' }}
          INPUT_LOOKBACK: ${{ github.event.inputs.lookback_hours || '48' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing Actions secrets SUPABASE_URL / SUPABASE_SECRET_KEY — skip."
            exit 0
          fi
          if [ -z "${ETH_RPC_URL:-}" ]; then
            echo "WARN: ETH_RPC_URL unset — falling back to public RPCs (rate-limited)."
          fi
          if [ -z "${ETHERSCAN_API_KEYS:-}" ]; then
            echo "WARN: ETHERSCAN_API_KEYS unset — verified-source filter disabled."
          else
            echo "Etherscan verified filter: ON (prefer_verified auto)"
          fi
          LIMIT="${INPUT_LIMIT}"
          SCAN="${INPUT_SCAN}"
          LOOKBACK="${INPUT_LOOKBACK}"
          echo "monitor params limit=${LIMIT} scan=${SCAN} lookback_hours=${LOOKBACK}"
          # Prefer verified when ETHERSCAN_API_KEYS is set (default in discover).
          # Logs creates_found / verified_kept / unverified_skipped / scanned on stderr.
          python -m eth_scanner monitor \
            --limit "${LIMIT}" \
            --lookback-hours "${LOOKBACK}" \
            --scan "${SCAN}" \
            --json \
            --persist
